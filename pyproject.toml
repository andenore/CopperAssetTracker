[project]
name = "copper-asset-tracker"
version = "0.1.0"
description = "CopperScript cellular/GNSS/BLE asset tracker with rechargeable battery power"
requires-python = ">=3.12"
dependencies = ["copperscript"]

[project.optional-dependencies]
qualification = ["copperscript[qualification]"]

[tool.uv]
package = false

[tool.uv.sources]
copperscript = { git = "https://github.com/andenore/CopperScript.git", rev = "9c0b61b354c5eb4771ddb22204889a80e67600ac" }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
