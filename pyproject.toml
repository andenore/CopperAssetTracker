[project]
name = "copper-asset-tracker"
version = "0.1.0"
description = "CopperScript cellular/GNSS/BLE asset tracker with rechargeable battery power"
requires-python = ">=3.12"
dependencies = ["copperscript"]

[project.optional-dependencies]
qualification = ["copperscript[qualification]"]

[tool.uv]
package = false

[tool.uv.sources]
copperscript = { git = "https://github.com/andenore/CopperScript.git", rev = "db125738d3cdc0cde8293fc9476e8a0a12366317" }

[dependency-groups]
dev = ["pytest>=8"]
