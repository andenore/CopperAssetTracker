[project]
name = "copper-asset-tracker"
version = "0.1.0"
description = "CopperScript cellular/GNSS/BLE asset tracker with rechargeable battery power"
requires-python = ">=3.12"
dependencies = ["copperscript"]

[project.optional-dependencies]
qualification = ["copperscript[qualification]"]

[tool.uv]
package = false

[tool.uv.sources]
copperscript = { git = "https://github.com/andenore/CopperScript.git", rev = "7fc76641029ffff97f185a8f7dad5c77c5900531" }

[dependency-groups]
dev = ["pytest>=8"]
