name: Source checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CopperAssetTracker
    steps:
      - uses: actions/checkout@v4
        with:
          path: CopperAssetTracker
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned Rust compiler
        run: make install-compiler
      - run: make fetch
      - run: make check test compile
