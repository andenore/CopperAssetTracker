name: JLCPCB manufacturing files
# Routes the board from source with the pinned compiler (its own fill, DRC and plotter), then runs
# `make order`: build/order/jlcpcb/gerbers-drill.zip is the fab upload, bom.csv
# and cpl.csv the assembly upload, hand-assembly.csv the parts to fit by hand.
# The files are native-DRC-clean, not an independently CAM-qualified release
# (see the Makefile's order target).
# The native job needs no KiCad and is the one that gates the build. The kicad
# job repeats route and order with KiCad's fill, DRC and plotter as a
# cross-check; its failure is reported but does not fail the workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manufacturing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  order:
    name: order (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [native, kicad]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.toolchain == 'kicad' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read the pinned CopperScript revision
        id: pin
        run: echo "rev=$(cat .copper-version)" >> "$GITHUB_OUTPUT"
      # The KiCad install script (kicad job only) and its version pins come from
      # the same CopperScript revision as the compiler.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: andenore/CopperScript
          ref: ${{ steps.pin.outputs.rev }}
          path: .copperscript
          persist-credentials: false
      - name: Restore the pinned compiler
        id: copper-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/copper-bin
          key: copper-${{ runner.os }}-${{ steps.pin.outputs.rev }}
      - name: Install the pinned compiler
        if: steps.copper-cache.outputs.cache-hit != 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo +1.97.0 install --path .copperscript/crates/copper --locked --root ~/copper-bin copper
      - run: echo "$HOME/copper-bin/bin" >> "$GITHUB_PATH"
      - name: Restore cached KiCad packages
        if: matrix.toolchain == 'kicad'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /home/runner/kicad-debs
          key: kicad10-debs-${{ hashFiles('.copperscript/.github/board-toolchain.json') }}
      # The kicad job passes KICAD=1 to make route and make order; without it
      # they use CopperScript's own fill, DRC and plotter.
      - name: Install KiCad 10 (pinned Ubuntu packages)
        if: matrix.toolchain == 'kicad'
        env:
          KICAD_PINS: .copperscript/.github/board-toolchain.json
          KICAD_DEB_CACHE: /home/runner/kicad-debs
        run: bash .copperscript/scripts/ci_install_kicad10.sh
      # The route runs offline (copper build), so fetch the locked
      # packages and footprint libraries into .copper-cache first.
      - name: Fetch the locked packages
        run: copper lock board.copper --locked
      - name: Route, refill and run DRC
        run: make route COPPER=copper ${{ matrix.toolchain == 'kicad' && 'KICAD=1' || '' }}
      - name: Build the JLCPCB order package
        run: make order COPPER=copper ${{ matrix.toolchain == 'kicad' && 'KICAD=1' || '' }}
      - name: Summarize the order package
        run: |
          {
            echo "### JLCPCB order package (${{ matrix.toolchain }})"
            echo "Upload \`jlcpcb/gerbers-drill.zip\` for the PCB, \`jlcpcb/bom.csv\` and \`jlcpcb/cpl.csv\` for assembly."
            echo "Check every part in JLCPCB's placement preview; parts in \`hand-assembly.csv\` are fitted by hand."
            echo '```'
            (cd build/order && find . -maxdepth 2 -type f | sort)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jlcpcb-${{ github.event.repository.name }}-${{ github.sha }}${{ matrix.toolchain == 'kicad' && '-kicad' || '' }}
          path: build/order/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: route-run-${{ github.sha }}${{ matrix.toolchain == 'kicad' && '-kicad' || '' }}
          path: |
            build/board/*/run.json
            build/board/*/*.json
            build/board/*/*.log
          if-no-files-found: warn
